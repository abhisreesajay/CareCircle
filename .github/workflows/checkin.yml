name: CareCircle Check-in Notifications

on:
  schedule:
    # 10:00 AM IST
    - cron: "30 4 * * *"
    # 10:15 AM IST
    - cron: "45 4 * * *"
    # 10:30 AM IST
    - cron: "0 5 * * *"

    # 1:00 PM IST
    - cron: "30 7 * * *"
    # 1:15 PM IST
    - cron: "45 7 * * *"
    # 1:30 PM IST
    - cron: "0 8 * * *"

    # 5:00 PM IST
    - cron: "30 11 * * *"
    # 5:15 PM IST
    - cron: "45 11 * * *"
    # 5:30 PM IST
    - cron: "0 12 * * *"

    # 9:00 PM IST
    - cron: "30 15 * * *"
    # 9:15 PM IST
    - cron: "45 15 * * *"
    # 9:30 PM IST
    - cron: "0 16 * * *"

  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Firebase Admin SDK
        run: |
          pip install firebase-admin

      - name: Run CareCircle check-in scheduler
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python checkin_scheduler.py